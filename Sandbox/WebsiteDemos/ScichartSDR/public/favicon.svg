  <rect x="248" y="304" width="16" height="114" rx="8" fill="#ffe58b"/>
  <rect x="276" y="330" width="14" height="88" rx="7" fill="#88e56c"/>
  <rect x="302" y="348" width="14" height="70" rx="7" fill="#4cd479"/>
  <rect x="328" y="364" width="14" height="54" rx="7" fill="#29b46d"/>
  <rect x="354" y="380" width="14" height="38" rx="7" fill="#1e8f6c"/>
  <rect x="380" y="392" width="14" height="26" rx="7" fill="#156d65"/>

  
  
  
</svg>