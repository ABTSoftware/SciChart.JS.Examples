[package]
name = "tauri-simple-server-licensing"
version = "0.1.0"
edition = "2021"

[lib]
name = "tauri_simple_server_licensing_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"   # minimise binary size
strip = true
